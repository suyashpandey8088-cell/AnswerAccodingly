[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quizpilot-backend"
version = "0.1.0"
description = "Local QA orchestration backend for QuizPilot AI"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "browser: requires Playwright Chromium; use --run-browser to enable",
  "desktop: requires a graphical desktop and OCR; disabled in headless CI",
  "sandbox: requires Docker and an explicitly enabled sandbox",
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
